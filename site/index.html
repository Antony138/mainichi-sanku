<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>每日场景日语</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="場面">
<meta name="theme-color" content="#F4F6F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161A" media="(prefers-color-scheme: dark)">
<style>
  :root {
    color-scheme: light;
    --bg: #F4F6F3;
    --card: #FFFFFF;
    --ink: #20242B;
    --muted: #6C7480;
    --line: #E3E7E1;
    --accent: #2D55D8;
    --accent-ink: #2D55D8;
    --wash: #EDF1FD;
    --shadow: 0 1px 2px rgba(32,36,43,.05);
    --hl-g: #FFE08A; --hl-g-ink: #8A5A00;
    --hl-v: #BDEBC9; --hl-v-ink: #1E7A44;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #14161A;
      --card: #1D2026;
      --ink: #E9EBEE;
      --muted: #99A1AD;
      --line: #2B2F37;
      --accent: #8FA6FF;
      --accent-ink: #A9BAFF;
      --wash: #242B40;
      --shadow: none;
      --hl-g: #6B5313; --hl-g-ink: #F4CD6A;
      --hl-v: #1F5535; --hl-v-ink: #8FDCA8;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #14161A; --card: #1D2026; --ink: #E9EBEE; --muted: #99A1AD;
    --line: #2B2F37; --accent: #8FA6FF; --accent-ink: #A9BAFF; --wash: #242B40; --shadow: none;
    --hl-g: #6B5313; --hl-g-ink: #F4CD6A; --hl-v: #1F5535; --hl-v-ink: #8FDCA8;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #F4F6F3; --card: #FFFFFF; --ink: #20242B; --muted: #6C7480;
    --line: #E3E7E1; --accent: #2D55D8; --accent-ink: #2D55D8; --wash: #EDF1FD;
    --shadow: 0 1px 2px rgba(32,36,43,.05);
    --hl-g: #FFE08A; --hl-g-ink: #8A5A00; --hl-v: #BDEBC9; --hl-v-ink: #1E7A44;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "PingFang SC", "Hiragino Sans", sans-serif;
    line-height: 1.6;
  }
  .wrap {
    max-width: 520px;
    margin: 0 auto;
    padding: max(24px, env(safe-area-inset-top)) 18px 8px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  header { padding: 0 4px 2px; }
  .eyebrow {
    font-size: 12px; font-weight: 600; letter-spacing: .06em;
    color: var(--muted); font-variant-numeric: tabular-nums;
    display: flex; align-items: center; gap: 8px;
  }
  .chip {
    font-size: 10px; font-weight: 700; letter-spacing: .12em;
    color: var(--accent-ink); background: var(--wash);
    border-radius: 4px; padding: 1px 6px;
  }
  h1 { margin: 6px 0 2px; font-size: 23px; font-weight: 800; text-wrap: balance; }
  .sub { margin: 0; font-size: 13.5px; color: var(--muted); }

  .secTitle {
    margin: 10px 4px 0;
    font-size: 13px; font-weight: 700; letter-spacing: .06em; color: var(--muted);
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: var(--shadow);
    padding: 6px 0 0;
    overflow: hidden;
  }
  .card + .card { margin-top: 12px; }
  .scene {
    display: flex; align-items: center; gap: 10px;
    font-size: 12px; font-weight: 600; letter-spacing: .06em;
    color: var(--muted); padding: 8px 12px 0 16px;
  }
  .sceneTxt { flex: 1; min-width: 0; }
  .scene b { color: var(--accent-ink); font-weight: 700; }

  /* WIP 标记：把正在重点练的场景收藏起来，顶部导航可一键筛选 */
  .star {
    flex: 0 0 auto; display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 9px; border-radius: 13px;
    border: 1px solid var(--line); background: var(--card); color: var(--muted);
    font: 700 10px/1 system-ui, sans-serif; letter-spacing: .1em;
    cursor: pointer; transition: color .15s ease, background .15s ease, border-color .15s ease;
  }
  .star svg { display: block; }
  .star.on { color: var(--accent-ink); background: var(--wash); border-color: var(--accent); }
  .star.on svg path { fill: currentColor; }
  .star:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .desc { margin: 2px 0 6px; padding: 0 16px; font-size: 12.5px; color: var(--muted); }

  /* 场景对话（新格式）：每句 = 说话人 + 日语行 + 英语行 + 中文 */
  .line { border-top: 1px solid var(--line); }
  .who {
    padding: 9px 16px 0;
    font-size: 11px; font-weight: 700; letter-spacing: .08em;
    color: var(--accent-ink); opacity: .85;
  }
  .line .row { padding: 4px 16px 6px; }
  .line .row + .row { border-top: 0; padding-top: 0; }
  .line .row .ja { line-height: 1.9; }
  .row.sub .en { font-size: 15.5px; padding-top: 0; }
  .cn.plain { border-top: 0; padding: 0 16px 10px; }
  .tip {
    margin: 0; border-top: 1px solid var(--line);
    padding: 10px 16px 12px;
    font-size: 12.5px; color: var(--muted);
  }

  .row {
    display: flex; align-items: flex-start; gap: 12px;
    width: 100%; text-align: left;
    background: none; border: 0; padding: 12px 16px; margin: 0;
    color: inherit; font: inherit; cursor: pointer;
    transition: background .15s ease;
  }
  .row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .row + .row { border-top: 1px solid var(--line); }
  .row.playing { background: var(--wash); }
  .row.playing .txt { color: var(--accent-ink); }

  .icon { flex: 0 0 20px; margin-top: 5px; color: var(--muted); }
  .row.playing .icon { color: var(--accent-ink); }
  .icon svg { display: block; }
  .eq { display: none; gap: 2.5px; align-items: flex-end; height: 14px; width: 20px; padding-left: 2px; }
  .eq i { width: 3px; background: currentColor; border-radius: 1px; animation: eq 1s ease-in-out infinite; }
  .eq i:nth-child(1) { height: 60%; }
  .eq i:nth-child(2) { height: 100%; animation-delay: .25s; }
  .eq i:nth-child(3) { height: 45%; animation-delay: .5s; }
  @keyframes eq { 0%,100% { transform: scaleY(.4);} 50% { transform: scaleY(1);} }
  .row.playing .spk { display: none; }
  .row.playing .eq { display: flex; }
  @media (prefers-reduced-motion: reduce) { .eq i { animation: none; } }

  .txt { flex: 1; min-width: 0; }
  .ja {
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic Medium", system-ui, sans-serif;
    font-size: 20px; line-height: 2;
  }
  .ja rt { font-size: 10px; color: var(--muted); font-weight: 400; }
  .row.playing .ja rt { color: var(--accent-ink); opacity: .75; }
  .en {
    font-family: ui-serif, Georgia, "Times New Roman", serif;
    font-size: 19px; line-height: 1.55; padding-top: 3px;
  }
  .lang {
    display: block;
    font-family: system-ui, sans-serif;
    font-size: 10px; font-weight: 700; letter-spacing: .14em;
    color: var(--muted); margin-bottom: 1px;
  }

  .cn {
    margin: 0; border-top: 1px solid var(--line);
    padding: 10px 16px 12px;
    font-size: 13.5px; color: var(--muted);
    cursor: pointer; transition: filter .2s ease;
  }
  body.hidecn .cn:not(.peek) { filter: blur(5px); }

  .compact .ja { font-size: 17px; line-height: 1.9; }
  .compact .en { font-size: 16px; }
  .compact .row { padding: 10px 16px; }
  .compact .cn { font-size: 12.5px; }

  /* 顶部导航：历史日期 + WIP 筛选，滚动时吸附在顶端 */
  .topbar {
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; gap: 8px;
    margin: 0 -18px; padding: 6px 14px;
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .wipToggle {
    flex: 0 0 auto; display: inline-flex; align-items: center; gap: 5px;
    height: 30px; padding: 0 11px; border-radius: 15px;
    border: 1px solid var(--line); background: var(--card); color: var(--muted);
    font: 700 11.5px/1 system-ui, sans-serif; letter-spacing: .06em;
    font-variant-numeric: tabular-nums; cursor: pointer;
    transition: color .15s ease, background .15s ease, border-color .15s ease;
  }
  .wipToggle svg { display: block; }
  .wipToggle.on { border-color: var(--accent); color: var(--accent-ink); background: var(--wash); }
  .wipToggle.on svg path { fill: currentColor; }
  .wipToggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .chips {
    flex: 1; min-width: 0; position: relative;
    display: flex; align-items: center; gap: 8px;
    overflow-x: auto; padding: 4px;
    scrollbar-width: none; scroll-behavior: smooth;
  }
  .chips::-webkit-scrollbar { display: none; }
  .datechip {
    flex: 0 0 auto;
    border: 1px solid var(--line); border-radius: 16px;
    background: var(--card); color: var(--muted);
    font: 600 12.5px/1 system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    padding: 8px 12px; cursor: pointer;
    max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .datechip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .datechip.sel { border-color: var(--accent); color: var(--accent-ink); background: var(--wash); }
  .datechip.wip::before {
    content: '★'; margin-right: 4px; font-size: 10px;
    color: var(--accent-ink); vertical-align: 1px;
  }
  .datechip .chipDate { margin-left: 6px; opacity: .6; }
  .hint { font-size: 12px; color: var(--muted); padding: 8px 2px; white-space: nowrap; }

  .bar {
    position: sticky; bottom: 0; margin-top: 4px;
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    background: color-mix(in srgb, var(--bg) 80%, transparent);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border-top: 1px solid var(--line);
    display: flex; gap: 8px; justify-content: center;
  }
  .pill {
    flex: 1; max-width: 150px; height: 40px; border-radius: 20px;
    border: 1px solid var(--line); background: var(--card); color: var(--muted);
    font: 600 13px/1 system-ui, sans-serif; cursor: pointer;
    transition: all .15s ease;
  }
  .pill:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pill.on { border-color: var(--accent); color: var(--accent-ink); background: var(--wash); }

  footer {
    padding: 8px 22px calc(18px + env(safe-area-inset-bottom));
    font-size: 12px; color: var(--muted); text-align: center; text-wrap: balance;
  }
  /* 已学内容高亮：语法=黄色荧光笔，词汇=绿色；点一下看是哪个语法点 */
  mark.lrn {
    color: inherit; background: linear-gradient(transparent 58%, var(--hl-g) 58%);
    border-radius: 2px; padding: 0 1px; cursor: help;
  }
  mark.lrn.v { background: linear-gradient(transparent 58%, var(--hl-v) 58%); }
  .compact mark.lrn { background: linear-gradient(transparent 62%, color-mix(in srgb, var(--hl-g) 70%, transparent) 62%); }
  .compact mark.lrn.v { background: linear-gradient(transparent 62%, color-mix(in srgb, var(--hl-v) 70%, transparent) 62%); }
  .learned {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    margin: 0 0 8px; padding: 0 16px;
  }
  .learned .lbl { font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--muted); }
  .lchip {
    border: 0; border-radius: 4px; padding: 3px 7px; cursor: pointer;
    font: 700 11.5px/1.2 "Hiragino Sans", system-ui, sans-serif;
    background: color-mix(in srgb, var(--hl-g) 55%, transparent); color: var(--hl-g-ink);
  }
  .lchip.v { background: color-mix(in srgb, var(--hl-v) 55%, transparent); color: var(--hl-v-ink); }
  .lchip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .lpop {
    position: absolute; z-index: 40; width: min(300px, calc(100vw - 32px));
    background: var(--card); color: var(--ink);
    border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 8px 28px rgba(0,0,0,.16);
    padding: 11px 13px 12px; font-size: 13px; line-height: 1.55;
  }
  .lpop[hidden] { display: none; }
  .lpop .t { font: 800 14.5px/1.4 "Hiragino Sans", system-ui, sans-serif; margin-bottom: 3px; }
  .lpop .t .k { font: 700 10px/1 system-ui, sans-serif; letter-spacing: .12em; margin-left: 6px; color: var(--hl-g-ink); }
  .lpop.v .t .k { color: var(--hl-v-ink); }
  .lpop .ex { margin-top: 5px; color: var(--muted); font-family: "Hiragino Sans", system-ui, sans-serif; }
  .lpop .src { margin-top: 6px; font-size: 11px; color: var(--muted); letter-spacing: .04em; }

  .loading { padding: 30px 0; text-align: center; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow"><span id="dateLabel">—</span> <span class="chip" id="dayChip">今日</span></div>
    <h1>今日の場面</h1>
    <p class="sub">一天一个实用场景 — 点哪句读哪句，日语英语都能点</p>
  </header>

  <nav class="topbar" id="topbar" hidden>
    <button class="wipToggle" id="btnWip" aria-pressed="false" aria-label="只看 WIP 场景" title="只看 WIP 场景"></button>
    <div class="chips" id="histChips"></div>
  </nav>

  <main id="main"><div class="loading">加载中…</div></main>

  <section id="reviewSec" hidden>
    <h2 class="secTitle">温故 · 间隔复习</h2>
    <div id="reviewBox"></div>
  </section>

  <div class="bar">
    <button class="pill" id="btnPlay" aria-pressed="false">▶ 连播</button>
    <button class="pill" id="btnSlow" aria-pressed="false">0.75× 慢速</button>
    <button class="pill" id="btnLoop" aria-pressed="false">循环</button>
    <button class="pill" id="btnCn" aria-pressed="false">隐藏中文</button>
  </div>

  <div class="lpop" id="lpop" role="dialog" aria-live="polite" hidden></div>

  <footer>每天 6:00 (JST) 自动更新 · edge-tts 神经语音 · 听过的句子离线可用<span id="visits"></span></footer>
</div>

<script>
  const SPK = '<span class="spk"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg></span><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>';
  const star = (n) => `<svg width="${n}" height="${n}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="m12 3.6 2.55 5.17 5.7.83-4.12 4.02.97 5.68L12 16.6l-5.1 2.68.97-5.68L3.75 9.6l5.7-.83L12 3.6z"/></svg>`;
  const WD = ['周日','周一','周二','周三','周四','周五','周六'];
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  const player = new Audio();
  player.preservesPitch = true;
  if ('webkitPreservesPitch' in player) player.webkitPreservesPitch = true;

  let rate = 1, loop = false, currentKey = null, currentRow = null, loopTimer = null;
  const dayCache = new Map();
  let dates = [], selected = null, latest = null;

  // WIP：正在重点练习的场景，日期 → 场景标题，存本地
  const WIP_KEY = 'msk_wip';
  let wip = new Map(), wipOnly = false;
  try { wip = new Map(Object.entries(JSON.parse(localStorage.getItem(WIP_KEY) || '{}'))); } catch {}
  const saveWip = () => { try { localStorage.setItem(WIP_KEY, JSON.stringify(Object.fromEntries(wip))); } catch {} };

  const $ = (id) => document.getElementById(id);

  // 已学内容（learned.json）：按顺序匹配，先到先得、不重叠；匹配在去掉振假名的日文上做，
  // 再映射回 ruby HTML，振假名组只要碰到就整个包进高亮里
  let learned = [];
  async function loadLearned() {
    try {
      const res = await fetch('learned.json', { cache: 'no-cache' });
      const j = await res.json();
      learned = (j.items || []).map((it) => {
        try { return { ...it, re: new RegExp(it.pattern, 'g') }; } catch { return null; }
      }).filter(Boolean);
    } catch { learned = []; }
  }

  function findLearned(ja) {
    const hits = [];
    for (const it of learned) {
      it.re.lastIndex = 0;
      let m;
      while ((m = it.re.exec(ja))) {
        if (!m[0]) { it.re.lastIndex += 1; continue; }
        const s = m.index, e = s + m[0].length;
        if (!hits.some((h) => s < h.e && h.s < e)) hits.push({ s, e, it });
      }
    }
    return hits.sort((a, b) => a.s - b.s);
  }

  function highlight(ruby, ja) {
    if (!learned.length || !ja) return { html: ruby, ids: [] };
    const hits = findLearned(ja);
    if (!hits.length) return { html: ruby, ids: [] };
    const units = [];
    const re = /<ruby>([\s\S]*?)<rt>[\s\S]*?<\/rt><\/ruby>|([\s\S])/g;
    let m, pos = 0;
    while ((m = re.exec(ruby))) {
      const base = m[1] !== undefined ? m[1] : m[2];
      units.push({ html: m[0], s: pos, e: pos + base.length });
      pos += base.length;
    }
    if (pos !== ja.length) return { html: ruby, ids: [] };   // 对不上就不冒险
    let out = '', open = null;
    for (const u of units) {
      const h = hits.find((x) => u.s < x.e && x.s < u.e) || null;
      if (h !== open) {
        if (open) out += '</mark>';
        if (h) out += `<mark class="lrn${h.it.kind === 'vocab' ? ' v' : ''}" data-lid="${esc(h.it.id)}">`;
        open = h;
      }
      out += u.html;
    }
    if (open) out += '</mark>';
    return { html: out, ids: [...new Set(hits.map((h) => h.it.id))] };
  }

  function learnedBar(ids, from) {
    if (!ids.length) return '';
    const items = learned.filter((it) => ids.includes(it.id));
    return `<div class="learned"><span class="lbl">已学${from ? ` · ${esc(from)}` : ''}</span>${items.map((it) =>
      `<button class="lchip${it.kind === 'vocab' ? ' v' : ''}" data-lid="${esc(it.id)}">${esc(it.label.replace(/（.*?）$/, ''))}</button>`).join('')}</div>`;
  }

  function showPop(el) {
    const it = learned.find((x) => x.id === el.dataset.lid);
    const pop = $('lpop');
    if (!it) return;
    if (!pop.hidden && pop.dataset.for === it.id && pop._anchor === el) { hidePop(); return; }
    pop.className = 'lpop' + (it.kind === 'vocab' ? ' v' : '');
    pop.innerHTML = `<div class="t">${esc(it.label)}<span class="k">${it.kind === 'vocab' ? '词汇' : '语法'}</span></div>
      <div>${esc(it.note)}</div>
      ${it.example ? `<div class="ex">例：${esc(it.example)}</div>` : ''}
      ${it.source ? `<div class="src">${esc(it.source)}</div>` : ''}`;
    pop.dataset.for = it.id;
    pop._anchor = el;
    pop.hidden = false;
    const r = el.getBoundingClientRect();
    const w = pop.offsetWidth, vw = document.documentElement.clientWidth;
    const left = Math.min(Math.max(16, r.left + r.width / 2 - w / 2), vw - w - 16);
    let top = r.bottom + 8;
    if (top + pop.offsetHeight > window.innerHeight - 70) top = r.top - pop.offsetHeight - 8;
    pop.style.left = `${left + window.scrollX}px`;
    pop.style.top = `${top + window.scrollY}px`;
  }
  function hidePop() { $('lpop').hidden = true; $('lpop')._anchor = null; }
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hidePop(); });
  window.addEventListener('resize', hidePop);

  function fmtDate(d) {
    const [y, m, dd] = d.split('-').map(Number);
    const wd = WD[new Date(y, m - 1, dd).getDay()];
    return `${y}年${m}月${dd}日 · ${wd}`;
  }
  function shiftISO(d, days) {
    const [y, m, dd] = d.split('-').map(Number);
    const t = new Date(Date.UTC(y, m - 1, dd + days));
    return t.toISOString().slice(0, 10);
  }

  async function fetchDay(d) {
    if (dayCache.has(d)) return dayCache.get(d);
    const res = await fetch(`data/${d}.json`, { cache: 'no-cache' });
    if (!res.ok) throw new Error(d);
    const j = await res.json();
    dayCache.set(d, j);
    return j;
  }

  function rowBtn(key, text, lang, cls, langTag, body, extra = '') {
    return `<button class="row${extra}" data-key="${key}" data-text="${text.replace(/"/g, '&quot;')}" data-lang="${lang}">
      <span class="icon">${SPK}</span>
      <span class="txt ${cls}"><span class="lang">${langTag}</span>${body}</span>
    </button>`;
  }

  function starBtn(date, title) {
    const on = wip.has(date);
    return `<button class="star${on ? ' on' : ''}" data-date="${date}" data-title="${esc(title)}"
      aria-pressed="${on}" aria-label="标记为 WIP（正在重点练习）" title="标记为 WIP（正在重点练习）">${star(15)}<span>WIP</span></button>`;
  }

  // 新格式：一天 = 一个场景的连续对话
  function scenarioCard(day, tag) {
    const sc = day.scenario;
    const ids = new Set();
    const lines = day.lines.map((l) => {
      const hl = highlight(l.ruby, l.ja);
      hl.ids.forEach((i) => ids.add(i));
      return `
      <div class="line">
        <div class="who">${l.speaker}</div>
        ${rowBtn(l.ja_audio, l.ja, 'ja-JP', 'ja', '日', hl.html)}
        ${rowBtn(l.en_audio, l.en, 'en-US', 'en', 'EN', l.en, ' sub')}
        <p class="cn plain" title="点击显示/隐藏">${l.cn}</p>
      </div>`;
    }).join('');
    return `<section class="card">
      <div class="scene">
        <span class="sceneTxt">${tag ? `<b>${tag}</b> · ${sc.title_ja}` : `場面 · <b>${sc.title_ja}</b>`} · ${sc.title_cn}</span>
        ${starBtn(day.date, sc.title_cn || sc.title_ja)}
      </div>
      ${sc.desc ? `<p class="desc">${sc.desc}</p>` : ''}
      ${learnedBar([...ids], sc.learned_from)}
      ${lines}
      ${sc.tip ? `<p class="tip">💡 ${sc.tip}</p>` : ''}
    </section>`;
  }

  // 旧格式（2026-07-16 以前）：一天 = 3 个独立例句，保留可回看
  function legacyCards(day, tag) {
    return day.scenes.map((s) => `
      <section class="card">
        <div class="scene"><span class="sceneTxt">${tag ? `<b>${tag}</b> · ` : '场景 · '}${s.scene}</span></div>
        ${rowBtn(s.ja_audio, s.ja, 'ja-JP', 'ja', '日', highlight(s.ruby, s.ja).html)}
        ${rowBtn(s.en_audio, s.en, 'en-US', 'en', 'EN', s.en)}
        <p class="cn" title="点击显示/隐藏">${s.cn}</p>
      </section>`).join('');
  }

  function dayCards(day, tag) {
    return day.lines ? scenarioCard(day, tag) : legacyCards(day, tag);
  }

  let queue = null, qi = 0;   // 连播队列（当天所有日语句）

  function clearQueue() {
    queue = null;
    $('btnPlay').classList.remove('on');
    $('btnPlay').setAttribute('aria-pressed', 'false');
  }

  function stopAudio() {
    clearTimeout(loopTimer);
    player.pause();
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    currentKey = null;
    if (currentRow) currentRow.classList.remove('playing');
    currentRow = null;
    clearQueue();
  }

  function start(row) {
    clearTimeout(loopTimer);
    if (currentRow) currentRow.classList.remove('playing');
    currentRow = row;
    currentKey = row.dataset.key;
    row.classList.add('playing');
    if (queue) row.scrollIntoView({ block: 'center', behavior: 'smooth' });
    player.src = row.dataset.key;
    player.playbackRate = rate;
    player.play().catch(() => {
      if ('speechSynthesis' in window) {
        const u = new SpeechSynthesisUtterance(row.dataset.text);
        u.lang = row.dataset.lang;
        u.rate = rate === 1 ? 1 : 0.8;
        u.onend = onEnded;
        speechSynthesis.speak(u);
      }
    });
  }

  function onEnded() {
    if (queue) {
      if (qi + 1 < queue.length) {
        qi += 1;
        loopTimer = setTimeout(() => start(queue[qi]), 850);
      } else if (loop) {
        qi = 0;
        loopTimer = setTimeout(() => start(queue[0]), 1500);
      } else {
        stopAudio();
      }
      return;
    }
    if (loop && currentRow) {
      const row = currentRow;
      loopTimer = setTimeout(() => start(row), 700);
    } else {
      stopAudio();
    }
  }
  player.addEventListener('ended', onEnded);
  player.addEventListener('play', () => { player.playbackRate = rate; });

  document.addEventListener('click', (e) => {
    const lrn = e.target.closest('mark.lrn, .lchip');
    if (lrn) { e.preventDefault(); showPop(lrn); return; }
    if (!e.target.closest('#lpop')) hidePop();
    const starEl = e.target.closest('.star');
    if (starEl) { toggleWip(starEl.dataset.date, starEl.dataset.title); return; }
    const row = e.target.closest('.row');
    if (row) {
      if (queue && !queue.includes(row)) clearQueue();
      else if (queue && currentKey !== row.dataset.key) { qi = queue.indexOf(row); }
      if (currentKey === row.dataset.key) stopAudio();
      else start(row);
      return;
    }
    const cn = e.target.closest('.cn');
    if (cn && document.body.classList.contains('hidecn')) cn.classList.toggle('peek');
    const chipEl = e.target.closest('.datechip');
    if (chipEl) select(chipEl.dataset.date);
  });

  $('btnPlay').addEventListener('click', () => {
    if (queue) { stopAudio(); return; }
    const rows = [...document.querySelectorAll('#main .row')].filter((r) => r.dataset.lang === 'ja-JP');
    if (!rows.length) return;
    stopAudio();
    queue = rows;
    qi = 0;
    $('btnPlay').classList.add('on');
    $('btnPlay').setAttribute('aria-pressed', 'true');
    start(rows[0]);
  });

  $('btnSlow').addEventListener('click', () => {
    rate = rate === 1 ? 0.75 : 1;
    const on = rate !== 1;
    $('btnSlow').classList.toggle('on', on);
    $('btnSlow').setAttribute('aria-pressed', String(on));
    player.playbackRate = rate;
  });
  $('btnLoop').addEventListener('click', () => {
    loop = !loop;
    $('btnLoop').classList.toggle('on', loop);
    $('btnLoop').setAttribute('aria-pressed', String(loop));
    if (!loop) clearTimeout(loopTimer);
  });
  $('btnCn').addEventListener('click', () => {
    const on = document.body.classList.toggle('hidecn');
    $('btnCn').classList.toggle('on', on);
    $('btnCn').setAttribute('aria-pressed', String(on));
    document.querySelectorAll('.cn').forEach((p) => p.classList.remove('peek'));
  });

  function toggleWip(date, title) {
    if (wip.has(date)) wip.delete(date);
    else wip.set(date, title || date);
    saveWip();
    syncStars();
    renderChips();
  }

  function syncStars() {
    document.querySelectorAll('.star').forEach((b) => {
      const on = wip.has(b.dataset.date);
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', String(on));
    });
  }

  function renderChips() {
    const box = $('histChips');
    $('topbar').hidden = !dates.length;
    $('btnWip').innerHTML = `${star(14)}WIP${wip.size ? ' ' + wip.size : ''}`;
    $('btnWip').classList.toggle('on', wipOnly);
    $('btnWip').setAttribute('aria-pressed', String(wipOnly));

    const list = [...dates].reverse().filter((d) => !wipOnly || wip.has(d));
    if (wipOnly && !list.length) {
      box.innerHTML = '<span class="hint">还没有 WIP — 点场景标题右侧的 ★ 标记正在练的场景</span>';
      return;
    }
    box.innerHTML = list.map((d) => {
      const [, m, dd] = d.split('-');
      const md = `${+m}/${+dd}`;
      const label = wipOnly
        ? `${esc(wip.get(d))}<span class="chipDate">${md}</span>`
        : md;
      const cls = (d === selected ? ' sel' : '') + (!wipOnly && wip.has(d) ? ' wip' : '');
      return `<button class="datechip${cls}" data-date="${d}">${label}</button>`;
    }).join('');
    centerChip();
  }

  // 选中的日期滚进可视区（历史变长后仍能看到自己在哪）
  function centerChip() {
    const box = $('histChips');
    const el = box.querySelector('.sel');
    if (el) box.scrollLeft = Math.max(0, el.offsetLeft - (box.clientWidth - el.offsetWidth) / 2);
  }

  $('btnWip').addEventListener('click', () => {
    wipOnly = !wipOnly;
    renderChips();
  });

  async function renderReview() {
    const box = $('reviewBox');
    box.innerHTML = '';
    let html = '';
    for (const n of [3, 7]) {
      const target = shiftISO(latest, -n);
      if (!dates.includes(target)) continue;
      try {
        const day = await fetchDay(target);
        html += `<div class="compact">${dayCards(day, `${n}天前`)}</div>`;
      } catch {}
    }
    box.innerHTML = html;
    $('reviewSec').hidden = !html;
  }

  async function select(d) {
    stopAudio();
    hidePop();
    selected = d;
    $('dateLabel').textContent = fmtDate(d);
    $('dayChip').textContent = d === latest ? '今日' : '回看';
    renderChips();
    try {
      const day = await fetchDay(d);
      $('main').innerHTML = dayCards(day, '');
    } catch {
      $('main').innerHTML = '<div class="loading">这一天的内容加载失败</div>';
    }
    if (d === latest) renderReview();
    else $('reviewSec').hidden = true;
    window.scrollTo({ top: 0 });
  }

  (async function init() {
    try {
      const [res] = await Promise.all([fetch('data/index.json', { cache: 'no-cache' }), loadLearned()]);
      dates = await res.json();
      latest = dates[dates.length - 1];
      await select(latest);
    } catch {
      $('main').innerHTML = '<div class="loading">加载失败 — 请检查网络后刷新</div>';
    }
  })();

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');

  // 访问统计：自建 Cloudflare Worker（见 cc-digest 仓库 counter/ 目录），不采集 IP、不种 cookie；失败时静默
  (() => {
    let nv = 0;
    try {
      if (!localStorage.getItem('msk_visited')) { nv = 1; localStorage.setItem('msk_visited', '1'); }
    } catch {}
    fetch('https://gh-visits.antony138.workers.dev/hit', { method: 'POST', body: JSON.stringify({ site: 'mainichi-sanku', nv }) })
      .then(r => r.json())
      .then(d => { if (d?.pv) document.getElementById('visits').textContent = ` · 访问 ${d.pv} · 访客 ${d.uv}`; })
      .catch(() => {});
  })();
</script>
</body>
</html>
